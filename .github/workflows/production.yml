name: Deploy Telemedicine GAS for PRD

# 完全に手動実行のみ
on:
  push:
    branches:
      - master
    paths:
      - 'gas/telemedicine_gas/**'
      - '.github/workflows/deploy_telemedicine_gas_prd.yml'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install bats & run bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version
          bats tests/

      - name: install npm deps & run npm tests
        run: |
          npm install
          npm test