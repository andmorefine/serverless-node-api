name: learn-github-actions
run-name: ${{ github.actor }} is learning GitHub Actions

on:
  push:                    # プッシュ時は check-bats-version だけ走る
  workflow_dispatch:       # 手動実行用トリガー
    inputs:
      run_tests:
        description: 'Run the tests job after the version check'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Check Bats version
        run: bats --version

      - name: Install npm dependencies
        run: npm install

  run-tests:
    needs: check-bats-version
    runs-on: ubuntu-latest
    # 条件: workflow_dispatch＋run_tests=true のとき、または再実行（run_attempt>1）のときだけジョブを起動
    if: ${{ 
      (
        github.event_name == 'workflow_dispatch' && 
        github.event.inputs.run_tests == 'true'
      ) || 
      (github.run_attempt > 1)
    }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bats & Run Bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version
          bats tests/

      - name: Install npm dependencies & Run npm tests
        run: |
          npm install
          npm test
